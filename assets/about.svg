<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="230" viewBox="0 0 850 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="850" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0" y1="0" x2="850" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace; }
  </style>

  <!-- Window Container -->
  <rect width="850" height="230" rx="14" fill="url(#termBg)"/>
  <rect x="0.75" y="0.75" width="848.5" height="228.5" rx="13.25" stroke="url(#termBorder)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <line x1="0" y1="38" x2="850" y2="38" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Mac Window Dots -->
  <circle cx="25" cy="19" r="5.5" fill="#ef4444"/>
  <circle cx="43" cy="19" r="5.5" fill="#f59e0b"/>
  <circle cx="61" cy="19" r="5.5" fill="#10b981"/>

  <text x="85" y="23" fill="#64748b" font-size="12" font-weight="600" class="mono">naveen@workstation: ~/profile (zsh)</text>

  <!-- Code Syntax Block -->
  <g class="mono" font-size="13.5" font-weight="500">
    <!-- Line 1 -->
    <text x="30" y="70">
      <tspan fill="#f43f5e" font-weight="700">const </tspan>
      <tspan fill="#38bdf8">engineer </tspan>
      <tspan fill="#ffffff">= </tspan>
      <tspan fill="#ffffff">{</tspan>
    </text>

    <!-- Line 2 -->
    <text x="50" y="94">
      <tspan fill="#94a3b8">name: </tspan>
      <tspan fill="#34d399">"Naveen"</tspan>
      <tspan fill="#ffffff">,</tspan>
    </text>

    <!-- Line 3 -->
    <text x="50" y="118">
      <tspan fill="#94a3b8">role: </tspan>
      <tspan fill="#34d399">"Full Stack Web Developer &amp; Cloud Deployment Specialist"</tspan>
      <tspan fill="#ffffff">,</tspan>
    </text>

    <!-- Line 4 -->
    <text x="50" y="142">
      <tspan fill="#94a3b8">techStack: </tspan>
      <tspan fill="#ffffff">[</tspan>
      <tspan fill="#34d399">"PHP/Laravel"</tspan><tspan fill="#ffffff">, </tspan>
      <tspan fill="#34d399">"React.js"</tspan><tspan fill="#ffffff">, </tspan>
      <tspan fill="#34d399">"MySQL"</tspan><tspan fill="#ffffff">, </tspan>
      <tspan fill="#34d399">"Docker"</tspan><tspan fill="#ffffff">, </tspan>
      <tspan fill="#34d399">"Jenkins"</tspan><tspan fill="#ffffff">, </tspan>
      <tspan fill="#34d399">"VPS"</tspan>
      <tspan fill="#ffffff">],</tspan>
    </text>

    <!-- Line 5 -->
    <text x="50" y="166">
      <tspan fill="#94a3b8">focus: </tspan>
      <tspan fill="#34d399">"Building scalable architectures &amp; high-performance web systems"</tspan>
      <tspan fill="#ffffff">,</tspan>
    </text>

    <!-- Line 6 -->
    <text x="50" y="190">
      <tspan fill="#94a3b8">status: </tspan>
      <tspan fill="#fbbf24">"Open for High-Impact Opportunities"</tspan>
