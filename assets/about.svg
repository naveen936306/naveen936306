<svg fill="none" viewBox="0 0 900 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal {
          background: #0b0f19;
          border-radius: 14px;
          border: 1px solid #1e293b;
          box-shadow: 0 15px 35px rgba(0,0,0,0.6);
          font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
          color: #e2e8f0;
          font-size: 13px;
          line-height: 1.6;
          padding: 16px 22px;
          box-sizing: border-box;
          height: 240px;
        }
        .term-header {
          display: flex;
          align-items: center;
          gap: 7px;
          margin-bottom: 12px;
          border-bottom: 1px solid #1e293b;
          padding-bottom: 10px;
        }
        .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .red { background: #ef4444; }
        .yellow { background: #f59e0b; }
        .green { background: #10b981; }
        .term-title {
          color: #64748b;
          font-size: 12px;
          margin-left: 8px;
        }
        .kw { color: #f43f5e; font-weight: 600; }
        .prop { color: #38bdf8; }
        .str { color: #34d399; }
        .num { color: #fbbf24; }
        .comment { color: #64748b; font-style: italic; }
      </style>
      <div class="terminal">
        <div class="term-header">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="term-title">naveen@workstation: ~/profile (zsh)</span>
        </div>
        <div>
          <span class="kw">const</span> <span class="prop">engineer</span> = {<br/>
          &nbsp;&nbsp;<span class="prop">name</span>: <span class="str">"Naveen"</span>,<br/>
          &nbsp;&nbsp;<span class="prop">role</span>: <span class="str">"Full Stack Web Developer &amp; DevOps Specialist"</span>,<br/>
          &nbsp;&nbsp;<span class="prop">stack</span>: [<span class="str">"PHP/Laravel"</span>, <span class="str">"React.js"</span>, <span class="str">"MySQL"</span>, <span class="str">"Docker"</span>, <span class="str">"Jenkins"</span>, <span class="str">"VPS"</span>],<br/>
          &nbsp;&nbsp;<span class="prop">traits</span>: [<span class="str">"Clean Architecture"</span>, <span class="str">"Database Optimization"</span>, <span class="str">"CI/CD Automation"</span>],<br/>
          &nbsp;&nbsp;<span class="prop">status</span>: <span class="str">"Building reliable &amp; ultra-fast web systems 🚀"</span><br/>
          };
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
