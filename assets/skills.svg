<svg fill="none" viewBox="0 0 900 310" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .skills-wrapper {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          color: #ffffff;
          box-sizing: border-box;
        }

        .skill-col {
          background: #0d1322;
          border: 1px solid #1e293b;
          border-radius: 14px;
          padding: 18px 16px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
          transition: all 0.3s ease;
        }

        .col-title {
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 0.5px;
          margin-bottom: 14px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .title-frontend { color: #38bdf8; }
        .title-backend { color: #818cf8; }
        .title-devops { color: #34d399; }

        .items-grid {
          display: flex;
          flex-direction: column;
          gap: 9px;
        }

        .item-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.06);
          border-radius: 8px;
          padding: 7px 12px;
          font-size: 13px;
          font-weight: 500;
          color: #cbd5e1;
        }

        .level-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          display: inline-block;
        }
        .frontend-dot { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
        .backend-dot { background: #818cf8; box-shadow: 0 0 6px #818cf8; }
        .devops-dot { background: #34d399; box-shadow: 0 0 6px #34d399; }
      </style>

      <div class="skills-wrapper">
        <!-- Frontend Column -->
        <div class="skill-col">
          <div class="col-title title-frontend">
            <span>🎨</span> FRONTEND
          </div>
          <div class="items-grid">
            <div class="item-row"><span>React.js</span> <span class="level-dot frontend-dot"></span></div>
            <div class="item-row"><span>JavaScript (ES6+)</span> <span class="level-dot frontend-dot"></span></div>
            <div class="item-row"><span>HTML5 &amp; CSS3</span> <span class="level-dot frontend-dot"></span></div>
            <div class="item-row"><span>Bootstrap 5</span> <span class="level-dot frontend-dot"></span></div>
            <div class="item-row"><span>jQuery</span> <span class="level-dot frontend-dot"></span></div>
          </div>
        </div>

        <!-- Backend Column -->
        <div class="skill-col">
          <div class="col-title title-backend">
            <span>⚙️</span> BACKEND &amp; DB
          </div>
          <div class="items-grid">
            <div class="item-row"><span>PHP 8+</span> <span class="level-dot backend-dot"></span></div>
            <div class="item-row"><span>Laravel Framework</span> <span class="level-dot backend-dot"></span></div>
            <div class="item-row"><span>CodeIgniter</span> <span class="level-dot backend-dot"></span></div>
            <div class="item-row"><span>MySQL Database</span> <span class="level-dot backend-dot"></span></div>
            <div class="item-row"><span>RESTful APIs</span> <span class="level-dot backend-dot"></span></div>
          </div>
        </div>

        <!-- DevOps Column -->
        <div class="skill-col">
          <div class="col-title title-devops">
            <span>🚀</span> DEVOPS &amp; HOSTING
          </div>
          <div class="items-grid">
            <div class="item-row"><span>Hostinger Cloud</span> <span class="level-dot devops-dot"></span></div>
            <div class="item-row"><span>VPS Linux Servers</span> <span class="level-dot devops-dot"></span></div>
            <div class="item-row"><span>Jenkins CI/CD</span> <span class="level-dot devops-dot"></span></div>
            <div class="item-row"><span>Docker</span> <span class="level-dot devops-dot"></span></div>
            <div class="item-row"><span>Git &amp; GitHub</span> <span class="level-dot devops-dot"></span></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
