<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="contactBg" x1="0" y1="0" x2="850" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1629"/>
      <stop offset="100%" stop-color="#140e2b"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
    .font-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #94a3b8; }
    .font-val { font-family: 'Fira Code', Consolas, monospace; font-size: 13px; fill: #f1f5f9; font-weight: 500; }
  </style>

  <!-- Container -->
  <rect width="850" height="260" rx="14" fill="url(#contactBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="35" y="38" fill="#38bdf8" class="font-title">📬 GET IN TOUCH / DIRECT INQUIRY</text>
  <text x="815" y="38" text-anchor="end" fill="#34d399" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">● 24H RESPONSE TIME</text>

  <line x1="35" y1="52" x2="815" y2="52" stroke="#1e293b"/>

  <!-- Left: Form Mockup Fields -->
  <g transform="translate(35, 70)">
    <!-- Field 1: Name / Email -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="font-label">YOUR INQUIRY / REASON:</text>
      <rect y="8" width="450" height="36" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#334155"/>
      <text x="14" y="31" class="font-val" fill="#cbd5e1">Project Development / Full Stack Consulting</text>
    </g>

    <!-- Field 2: Message Box -->
    <g transform="translate(0, 60)">
      <text x="0" y="0" class="font-label">DIRECT EMAIL CHANNEL:</text>
      <rect y="8" width="450" height="36" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#334155"/>
      <text x="14" y="31" class="font-val" fill="#34d399">naveen936306@gmail.com</text>
    </g>

    <!-- Field 3: Status Note -->
    <g transform="translate(0, 120)">
      <text x="0" y="14" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">
        ✨ Open for Freelance Projects, Full-Time Roles &amp; Technical Collaborations.
      </text>
    </g>
  </g>

  <!-- Right: Action Cards -->
  <g transform="translate(520, 70)">
    <!-- Email Button Box -->
    <g transform="translate(0, 0)">
      <rect width="295" height="48" rx="10" fill="url(#btnGrad)"/>
      <text x="147" y="30" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">
        ✉️ Send Direct Email
      </text>
    </g>

    <!-- LinkedIn Box -->
    <g transform="translate(0, 60)">
      <rect width="295" height="48" rx="10" fill="#0A66C2" fill-opacity="0.2" stroke="#0A66C2" stroke-opacity="0.5"/>
      <text x="147" y="30" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">
        💼 Connect on LinkedIn
      </text>
    </g>

    <!-- Location & Time -->
    <g transform="translate(0, 122)">
      <rect width="295" height="36" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="147" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" font-family="-apple-system, sans-serif">
        🌐 Remote Worldwide / IST Timezone
      </text>
    </g>
  </g>
</svg>
