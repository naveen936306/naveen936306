<svg fill="none" viewBox="0 0 900 280" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .header-container {
          background: linear-gradient(135deg, #090d16 0%, #0d1527 50%, #15102a 100%);
          border-radius: 20px;
          border: 1px solid rgba(99, 102, 241, 0.3);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.2);
          padding: 30px 40px;
          color: #ffffff;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
          height: 280px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }

        .glow-orb {
          position: absolute;
          width: 250px;
          height: 250px;
          border-radius: 50%;
          filter: blur(80px);
          pointer-events: none;
          z-index: 1;
        }
        .orb-1 { top: -80px; left: -80px; background: rgba(99, 102, 241, 0.35); }
        .orb-2 { bottom: -80px; right: -80px; background: rgba(6, 182, 212, 0.35); }

        .top-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: relative;
          z-index: 2;
        }

        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(16, 185, 129, 0.15);
          border: 1px solid rgba(16, 185, 129, 0.4);
          padding: 6px 14px;
          border-radius: 30px;
          font-size: 13px;
          font-weight: 600;
          color: #34d399;
          letter-spacing: 0.5px;
        }

        .pulse-dot {
          width: 8px;
          height: 8px;
          background: #10b981;
          border-radius: 50%;
          box-shadow: 0 0 10px #10b981;
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0% { transform: scale(0.95); opacity: 0.8; }
          50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
          100% { transform: scale(0.95); opacity: 0.8; }
        }

        .main-content {
          position: relative;
          z-index: 2;
          margin-top: -10px;
        }

        .greeting {
          font-size: 14px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 3px;
          color: #38bdf8;
          margin-bottom: 6px;
        }

        .name {
          font-size: 44px;
          font-weight: 900;
          margin: 0;
          letter-spacing: -0.5px;
          background: linear-gradient(90deg, #ffffff 0%, #c7d2fe 50%, #38bdf8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .title {
          font-size: 18px;
          color: #94a3b8;
          font-weight: 500;
          margin-top: 6px;
        }

        .title span {
          color: #818cf8;
          font-weight: 600;
        }

        .tag-row {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          position: relative;
          z-index: 2;
        }

        .tech-pill {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.12);
          backdrop-filter: blur(10px);
          padding: 6px 14px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 600;
          color: #e2e8f0;
          transition: all 0.3s ease;
        }

        .tech-pill.highlight {
          background: rgba(99, 102, 241, 0.2);
          border-color: rgba(99, 102, 241, 0.5);
          color: #a5b4fc;
        }
      </style>
      <div class="header-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        
        <div class="top-row">
          <div class="status-badge">
            <span class="pulse-dot"></span>
            AVAILABLE FOR OPPORTUNITIES
          </div>
          <div style="font-family: monospace; color: #64748b; font-size: 13px;">
            &lt;naveen.dev /&gt;
          </div>
        </div>

        <div class="main-content">
          <div class="greeting">HELLO WORLD, I'M</div>
          <h1 class="name">NAVEEN</h1>
          <div class="title">Senior <span>Full Stack Developer</span> &amp; Cloud Deployment Engineer</div>
        </div>

        <div class="tag-row">
          <span class="tech-pill highlight">PHP &amp; Laravel</span>
          <span class="tech-pill highlight">React.js</span>
          <span class="tech-pill">CodeIgniter</span>
          <span class="tech-pill">MySQL Database</span>
          <span class="tech-pill">Docker &amp; Jenkins CI/CD</span>
          <span class="tech-pill">Hostinger &amp; VPS Linux</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
