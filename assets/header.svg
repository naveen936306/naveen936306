<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0" y1="0" x2="850" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#140f2d"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="headerBorder" x1="0" y1="0" x2="850" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="nameGradient" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace; }
  </style>

  <!-- Card Background -->
  <rect width="850" height="240" rx="16" fill="url(#headerBg)"/>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="848.5" height="238.5" rx="15.25" stroke="url(#headerBorder)" stroke-width="1.5"/>

  <!-- Top Status Badge -->
  <g transform="translate(40, 28)">
    <rect width="240" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <circle cx="16" cy="14" r="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="30" y="18.5" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1" class="font-sans">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <text x="810" y="47" text-anchor="end" fill="#64748b" font-size="13" font-weight="600" class="font-mono">&lt;naveen.dev /&gt;</text>

  <!-- Greeting & Name -->
  <text x="40" y="88" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="3" class="font-sans">HELLO WORLD, I'M</text>
  <text x="40" y="132" fill="url(#nameGradient)" font-size="42" font-weight="900" letter-spacing="-0.5" class="font-sans">NAVEEN</text>
  
  <!-- Subtitle -->
  <text x="40" y="160" fill="#94a3b8" font-size="15" font-weight="500" class="font-sans">
    Full Stack Web Developer &amp; <tspan fill="#818cf8" font-weight="700">Cloud Deployment Specialist</tspan>
  </text>

  <!-- Tech Pills Row -->
  <g transform="translate(40, 182)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="112" height="28" rx="6" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.5"/>
      <text x="56" y="18" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600" class="font-sans">PHP &amp; Laravel</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(122, 0)">
      <rect width="84" height="28" rx="6" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-opacity="0.5"/>
      <text x="42" y="18" text-anchor="middle" fill="#a5f3fc" font-size="12" font-weight="600" class="font-sans">React.js</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(216, 0)">
      <rect width="102" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="51" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">CodeIgniter</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(328, 0)">
      <rect width="82" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="41" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">MySQL</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(420, 0)">
      <rect width="140" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="70" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Docker &amp; Jenkins</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(570, 0)">
      <rect width="138" height="28" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="69" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Hostinger &amp; VPS</text>
    </g>
  </g>
</svg>
