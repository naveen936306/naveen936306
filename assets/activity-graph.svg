<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="actBg" x1="0" y1="0" x2="850" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#130e2b"/>
    </linearGradient>

    <!-- Wave Fill Gradient -->
    <linearGradient id="waveFill" x1="0" y1="60" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Wave Stroke Gradient -->
    <linearGradient id="waveStroke" x1="50" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.5px; }
    .font-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #64748b; }
    .font-stat { font-family: 'Fira Code', monospace; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="850" height="260" rx="14" fill="url(#actBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Card Header -->
  <text x="35" y="38" fill="#f8fafc" class="font-title">⚡ DAILY COMMIT &amp; CONTRIBUTION METRICS</text>
  <text x="815" y="38" text-anchor="end" fill="#34d399" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">● ACTIVE SPRINT</text>

  <!-- Horizontal Grid Lines -->
  <line x1="35" y1="80" x2="815" y2="80" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="35" y1="120" x2="815" y2="120" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="35" y1="160" x2="815" y2="160" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="35" y1="200" x2="815" y2="200" stroke="#334155"/>

  <!-- Smooth Neon Activity Curve Area -->
  <path d="M 35 200 
           L 35 180 
           C 90 170, 130 130, 180 145 
           C 230 160, 270 90, 320 85 
           C 370 80, 410 150, 460 130 
           C 510 110, 550 70, 600 65 
           C 650 60, 690 120, 740 95 
           C 770 80, 790 70, 815 60 
           L 815 200 Z" 
        fill="url(#waveFill)"/>

  <!-- Curve Stroke -->
  <path d="M 35 180 
           C 90 170, 130 130, 180 145 
           C 230 160, 270 90, 320 85 
           C 370 80, 410 150, 460 130 
           C 510 110, 550 70, 600 65 
           C 650 60, 690 120, 740 95 
           C 770 80, 790 70, 815 60" 
        fill="none" stroke="url(#waveStroke)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Glowing Data Points -->
  <circle cx="180" cy="145" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="320" cy="85" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="460" cy="130" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
  <circle cx="600" cy="65" r="6" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="740" cy="95" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="815" cy="60" r="6" fill="#34d399" stroke="#ffffff" stroke-width="2"/>

  <!-- Day / Month Axis Labels -->
  <text x="35" y="222" class="font-label">WEEK 1</text>
  <text x="180" y="222" text-anchor="middle" class="font-label">WEEK 2</text>
  <text x="320" y="222" text-anchor="middle" class="font-label">WEEK 3</text>
  <text x="460" y="222" text-anchor="middle" class="font-label">WEEK 4</text>
  <text x="600" y="222" text-anchor="middle" class="font-label">WEEK 5</text>
  <text x="740" y="222" text-anchor="middle" class="font-label">WEEK 6</text>
  <text x="815" y="222" text-anchor="end" class="font-label">CURRENT</text>

  <!-- Summary Stats Bar inside footer -->
  <g transform="translate(35, 235)">
    <text x="0" y="14" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">
      Continuous Growth: <tspan fill="#38bdf8" font-weight="700">100% Dedicated</tspan> | Weekly Commits: <tspan fill="#34d399" font-weight="700">High Velocity</tspan> | Code Velocity: <tspan fill="#a855f7" font-weight="700">Peak</tspan>
    </text>
  </g>
</svg>
