<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="40" viewBox="0 0 850 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes typingEffect {
      0%, 100% { opacity: 0; }
      10%, 90% { opacity: 1; }
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .text-typing {
      font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
      font-size: 16px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .cursor {
      animation: blink 0.8s infinite;
      fill: #818cf8;
    }
  </style>

  <rect width="850" height="40" rx="8" fill="#0d1117" fill-opacity="0.6"/>
  <text x="425" y="25" text-anchor="middle" class="text-typing">
    ⚡ PHP &amp; Laravel Specialist | React.js | MySQL | Hostinger &amp; VPS | Jenkins CI/CD
    <tspan class="cursor">_</tspan>
  </text>
</svg>
